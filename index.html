<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Number Checker</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      font-family: Arial;
      background: linear-gradient(135deg,#141e30,#243b55);
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      color:#fff;
    }

    .box {
      width:90%;
      max-width:350px;
      background:rgba(255,255,255,0.08);
      padding:20px;
      border-radius:15px;
      text-align:center;
    }

    input {
      width:90%;
      padding:12px;
      border-radius:10px;
      border:none;
      margin:10px 0;
      text-align:center;
    }

    button {
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:linear-gradient(to right,#ff512f,#dd2476);
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .result {
      margin-top:15px;
      font-weight:bold;
    }

    .red { color:#ff4d4d; }
    .green { color:#00ff99; }

    .raw {
      margin-top:10px;
      font-size:12px;
      opacity:0.7;
      word-break:break-all;
    }

    /* ✅ Footer */
    .footer {
      margin-top:20px;
      font-size:14px;
      text-align:center;
    }

    .footer .brand {
      color:#00ff99;
      font-weight:bold;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Registeration Checker</h2>

  <input type="text" id="mobile" placeholder="Enter mobile number">

  <button onclick="check()">Check Status</button>

  <div class="result" id="result"></div>
  <div class="raw" id="raw"></div>
</div>

<!-- ✅ Footer -->
<div class="footer">
  Made with ❤️ by Vishal | <span class="brand">RAIGANJLOOTERS</span>
</div>

<script>
async function check() {
  const mobile = document.getElementById("mobile").value.trim();
  const result = document.getElementById("result");
  const raw = document.getElementById("raw");

  if (!/^[0-9]{10}$/.test(mobile)) {
    result.innerHTML = "Enter valid number";
    result.className = "result red";
    return;
  }

  result.innerHTML = "Checking...";
  raw.innerHTML = "";

  try {
    const res = await fetch("/api/check?mobile=" + mobile);
    const text = await res.text();

    raw.innerHTML = text;

    try {
      const data = JSON.parse(text);

      if (data.message === "") {
        result.innerHTML = "Fresh Number";
        result.className = "result green";
      } else {
        result.innerHTML = "Already Registered";
        result.className = "result red";
      }

    } catch {
      result.innerHTML = "Invalid API Response";
      result.className = "result red";
    }

  } catch (err) {
    result.innerHTML = "Server Error";
    result.className = "result red";
  }
}
</script>

</body>
</html>
