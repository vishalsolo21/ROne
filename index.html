<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Number Checker</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif;}
    body {
      background: linear-gradient(135deg,#141e30,#243b55);
      height:100vh; display:flex; align-items:center; justify-content:center; color:#fff;
    }
    .container {
      width:90%; max-width:380px; background:rgba(255,255,255,0.08);
      backdrop-filter:blur(10px); padding:25px; border-radius:18px; text-align:center;
    }
    input { width:100%; padding:14px; border-radius:12px; border:none; text-align:center; }
    button {
      margin-top:15px; width:100%; padding:14px; border-radius:12px;
      border:none; background:linear-gradient(to right,#ff512f,#dd2476);
      color:white; font-weight:600; cursor:pointer;
    }
    .result { margin-top:20px; font-weight:600; }
    .red { color:#ff4d4d; }
    .green { color:#00ff99; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Check Mobile Number</h2>
    <input type="tel" id="mobile" placeholder="Enter 10-digit mobile" maxlength="10">
    <button onclick="checkNumber()">Check Status</button>
    <div class="result" id="result"></div>
  </div>

<script>
async function checkNumber(){
  const mobile=document.getElementById("mobile").value.trim();
  const result=document.getElementById("result");

  if(!/^[0-9]{10}$/.test(mobile)){
    result.innerHTML="Enter valid number";
    result.className="result red";
    return;
  }

  try{
    const res=await fetch("/api/check?mobile="+mobile);
    const data=await res.json();

    if(data.status==="registered"){
      result.innerHTML="Registered";
      result.className="result red";
    } else if(data.status==="not_found"){
      result.innerHTML="For Found";
      result.className="result green";
    } else {
      result.innerHTML="Error";
      result.className="result red";
    }
  }catch(e){
    result.innerHTML="Server Error";
    result.className="result red";
  }
}
</script>
</body>
</html>
