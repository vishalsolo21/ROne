<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Response Viewer</title>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .box {
      width: 90%;
      max-width: 350px;
      background: #1e1e1e;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: none;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 8px;
      cursor: pointer;
    }
    #result {
      margin-top: 15px;
      word-break: break-all;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">
  <h3>Check API Response</h3>

  <input type="text" id="mobile" placeholder="Enter mobile number">

  <button onclick="check()">Check</button>

  <div id="result"></div>
</div>

<script>
async function check() {
  const mobile = document.getElementById("mobile").value;
  const result = document.getElementById("result");

  result.innerHTML = "Loading...";

  try {
    const res = await fetch("https://jm101.com/jiomartcoupon/getR1Points?mobile=" + mobile);
    const text = await res.text();

    result.innerHTML = text; // ✅ show raw API response

  } catch (err) {
    result.innerHTML = "Server Error / Blocked";
  }
}
</script>

</body>
</html>
